    <div class="line"></div>
    <div class="container">
      <main>
        <div class="ue">
          <h2>&lt;abbr&gt;略語であることを表す</h2>
          <div>
            <h4>ソースコード</h4>
            <pre class="src-code"><ol>
                    <li><span class="tag">&lt;p&gt;</span><span class="pln">何でも略していると語彙力が</span><span class="tag">&lt;abbr </span><span class="mz">title</span>=<span class="or">"マジ?"</span><span class="tag">></span><span class="pln">マ？</span><span class="tag">&lt;/abbr&gt;</span><br><span class="pln">といった感じになってしまう。</span><span class="tag">&lt;/p&gt;</span></li>
                    </ol></pre>
          </div>
          <div>
            <h4>実例</h4>
            <p>
              なんでも略していると語彙力が<abbr title="マジ?">マ？</abbr
              >といった感じになってしまう。
            </p>
          </div>
          <p>
            abbrは英語で略語を表すabbreviationを短縮したもの<br />少し長めに破線部にカーソルを合わせると表示される
          </p>
        </div>
      </main>
