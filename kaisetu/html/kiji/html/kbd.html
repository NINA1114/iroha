    <div class="line"></div>
    <div class="container">
      <main>
        <div class="ue">
          <h2>&lt;kbd&gt;<br />キーボードなどの入力端末で扱う文字を表す要素</h2>
          <div>
            <h4>ソースコード</h4>
            <pre class="src-code"><ol>
                    <li><span class="tag">&lt;kbd&gt;</span><span class="pln">Ctrl</span><span class="tag">&lt;/kbd&gt;</span><span class="pln">+</span><span class="tag">&lt;kbd&gt;</span><span class="pln">A</span><span class="tag">&lt;/kbd&gt;</span><span class="pln">ですべて選択して</span><br><span class="tag">&lt;kbd&gt;</span><span class="pln">Ctrl</span><span class="tag">&lt;/kbd&gt;</span><span class="pln">+</span><span class="tag">&lt;kbd&gt;</span><span class="pln">C</span><span class="tag">&lt;/kbd&gt;</span><span class="pln">でコピーするのが楽しいです。</span></li>
                    </ol></pre>
          </div>
          <div>
            <h4>実例</h4>
            <kbd>Ctrl</kbd
            >+<kbd>A</kbd>ですべて選択して<kbd>Ctrl</kbd>+<kbd>C</kbd>でコピーするのが楽しいです。
          </div>
          <p>
            kbdはkeyboardの略語<br />あなたがキーボードを操作したときに得られる効果を説明するときに使える<br />フォントが少し変わる
          </p>
        </div>
      </main>
