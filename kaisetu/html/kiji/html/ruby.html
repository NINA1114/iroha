    <div class="container">
        <main>
            <div class="ue">
                <h2>&lt;ruby&gt;ルビをふる文字列の範囲を指定する</h2>
                <div>
                    <h4>ソースコード</h4>
                    <pre class="src-code"><ol>
                    <li><span class="tag">&lt;p&gt;</span><span class="tag">&lt;ruby&gt;</span><span class="pln">>背黄青鸚哥</span><span class="tag">&lt;rt&gt;</span><span class="pln">>せきせいいんこ</span><span class="tag">&lt;/rt&gt;</span><span class="tag">&lt;ruby&gt;</span><span class="pln">、いつ使うんでしょうか</span><span class="tag">&lt;/p&gt;</span></li>
                    </ol></pre>
                </div>
                <div>
                    <h4>実例</h4>
                   <p><ruby>背黄青鸚哥<rt>せきせいいんこ</rt><ruby>、いつ使うんでしょうか</p>
                </div>
                <p>ルビを振りたい文字列を指定するときに使用する<br>難しい漢字の読み方が分からないとき、読んでいる人の助けになる</p>
            </div>
        </main>
