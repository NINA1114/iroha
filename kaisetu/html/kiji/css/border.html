<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>border 相槌大事</title>
    <link rel="stylesheet" href="../../../css/kiji.css" />
    <link rel="stylesheet" href="../../../css/kyotsu.css" />
    <link rel="icon" href="../../../../image/logo.png" />
    <style>
      h1 {
        border: solid;
      }
    </style>
  </head>
  <body>
    <div class="container headercontainer">
      <header>
        <a href="../../../../index.html"
          ><img src="../../../../image/logo.png" alt=""
        /></a>
        <ul>
          <li><a href="../../mokuji.html">HTML</a></li>
          <li><a href="../../mokuji2.html">CSS</a></li>
        </ul>
      </header>
    </div>
    <div class="line"></div>
    <div class="container">
      <main>
        <div class="ue">
          <h2>border<br />要素の外周に境界線を引くための値を一括で指定する</h2>
          <div class="src-code-container">
            <div>
              <h4>HTML</h4>
              <pre class="src-codex"><ol>
                        <li><span class="tag">&lt;h1&gt;</span><span class="pln">NARUHODO!</span><span class="tag">&lt;/h1&gt;</span></li>
                        </ol></pre>
            </div>
            <div>
              <h4>CSS</h4>
              <pre class="src-codex"><ol>
                            <li><span class="kir">h1{</span><br><span class="mz">border:</span><span class="or">solid;</span><br><span class="kir">}</span></li>
                            </ol></pre>
            </div>
          </div>
          <div>
            <h4>実例</h4>
            <h1>NARUHODO!</h1>
          </div>
          <p>
            外周に表示される境界線の色や種類、太さを<br />一括で指定する<br />種類ではsolid・dotted・dashedを指定できる
          </p>
        </div>
      </main>
    </div>
    <footer class="pagetop">
      <a href="#"><img src="../../../../image/prev.png" alt="" /></a>
      <a href="#"><img src="../../../../image/pagetop.png" alt="" /></a>
      <a href="#"><img src="../../../../image/next.png" alt="" /></a>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/gsap.min.js"></script>
    <script>
      const item20 = document.querySelector("body");
      const tl20 = gsap.timeline({
        defaults: { ease: "power0", duration: 2 },
        repeat: -1,
      });
      gsap.set(item20, {
        backgroundImage: "linear-gradient(45deg, #eca, #ace)",
      });
      tl20
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #ace, #eca)",
        })
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #ace, #ace)",
        })
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #eca, #ace)",
        })
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #eca, #eca)",
        })
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #eca, #ace)",
        });
    </script>
  </body>
</html>
