<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>text-shadow ふわふわは良い</title>
    <link rel="stylesheet" href="../../../css/kiji.css" />
    <link rel="stylesheet" href="../../../css/kyotsu.css" />
    <link rel="icon" href="../../../../image/logo.png" />
    <style>
      @font-face {
        font-family: "fuwa";
        src: url(../../../../font/majipane/majipane/majipane.otf);
      }
      h2 {
        text-shadow: 10px 10px 20px black;
      }
      h4 {
        text-shadow: 10px 10px 10px black;
      }
      p {
        text-shadow: 10px 10px 20px black;
      }

      h1 {
        text-shadow: 10px 10px 30px rgb(237, 116, 253);
        color: rgb(239, 176, 252);
        font-family: fuwa;
        font-size: 100px;
      }
      .fuwa {
        background-color: black;
        height: 100px;
        width: 300px;
        box-shadow: 0px 0px 10px 10px black;
      }
      .headercontainer {
        box-shadow: 0px 0px 20px 10px orange;
      }
      footer {
        box-shadow: 0px 0px 20px 10px lightblue;
      }
      pre.src-codex {
        width: 450px;
      }
    </style>
  </head>
  <body>
    <div class="container headercontainer">
      <header>
        <a href="../../../../index.html"
          ><img src="../../../../image/logo.png" alt=""
        /></a>
        <ul>
          <li><a href="../../mokuji.html">HTML</a></li>
          <li><a href="../../mokuji2.html">CSS</a></li>
        </ul>
      </header>
    </div>
    <div class="line"></div>
    <div class="container">
      <main>
        <div class="ue">
          <h2>text-shadow <br />文字に影をつける</h2>
          <div class="src-code-container">
            <div>
              <h4>HTML</h4>
              <pre class="src-codex"><ol>
                        <li><span class="tag">&lt;h1&gt;</span><span class="pln">ふわん</span><span class="tag">&lt;/h1&gt;</span></li>
                        </ol></pre>
            </div>
            <div>
              <h4>CSS</h4>
              <pre class="src-codex"><ol>
                            <li><span class="kir">h1{</span><br><span class="mz">text-shadow:</span><span class="mdr">10px 10px 30px 好きな色;</span><br><span class="kir">}</span></li>
                            </ol></pre>
            </div>
          </div>
          <div>
            <h4>実例</h4>
            <h1 class="fuwa">ふわん</h1>
          </div>
          <p>
            文字に影をつける<br />x座標とy座標、ぼかしの範囲、色を指定する<br />アニメーションがつくわけではない
          </p>
        </div>
      </main>
    </div>
    <footer class="pagetop">
      <a href="#"><img src="../../../../image/prev.png" alt="" /></a>
      <a href="#"><img src="../../../../image/pagetop.png" alt="" /></a>
      <a href="#"><img src="../../../../image/next.png" alt="" /></a>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.0/gsap.min.js"></script>
    <script>
      gsap.to(".fuwa", {
        duration: 1,
        repeat: -1,
        textShadow: "10px 10px 30px rgb(114,75,225)",
        yoyo: true,
        ease: "slow",
      });
    </script>

    <script>
      const item20 = document.querySelector("body");
      const tl20 = gsap.timeline({
        defaults: { ease: "power0", duration: 2 },
        repeat: -1,
      });
      gsap.set(item20, {
        backgroundImage: "linear-gradient(45deg, #eca, #ace)",
      });
      tl20
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #ace, #eca)",
        })
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #ace, #ace)",
        })
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #eca, #ace)",
        })
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #eca, #eca)",
        })
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #eca, #ace)",
        });
    </script>
  </body>
</html>
