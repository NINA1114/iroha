    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@barba/core"></script>
    <script>
      barba.init({
        transitions: [
          {
            async leave(data) {
              const done = this.async();
              leaveAnimation();
              await delay(3000);
              done();
            },
            async enter(data) {
              enterAnimation();
            },
          },
        ],
      });
      // 遅延用 引数の分だけ処理を遅らせる
      function delay(n) {
        n = n || 2000;
        return new Promise((done) => {
          setTimeout(() => {
            done();
          }, n);
        });
      }
      // ページを離れる時の上に消える動作
      function leaveAnimation() {
        const tl = gsap.timeline();
        tl.to(".container", {
          duration: 1,
          x: 100,
          opacity: 0,
          ease: "Quart.easeOut",
          onComplete: () => {
            window.scrollTo({
              top: 0,
              behavior: "smooth",
            });
          },
        });
      }
      // ページに入った時の下から出てくる動作
      function enterAnimation() {
        const tl = gsap.timeline();
        tl.from(".container", {
          duration: 1,
          x: 100,
          opacity: 0,
          ease: "Quart.easeOut",
        });
      }
    </script>
    <script>
      gsap.from(".setumei", {
        y: 10,
        autoAlpha: 0,
        duration: 1,
        ease: "power4.out",
        stagger: 0.1,
      });
    </script>
    <script>
      const item20 = document.querySelector("body");
      const tl20 = gsap.timeline({
        defaults: { ease: "power0", duration: 2 },
        repeat: -1,
      });
      gsap.set(item20, {
        backgroundImage: "linear-gradient(45deg, #eca, #ace)",
      });
      tl20
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #ace, #eca)",
        })
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #ace, #ace)",
        })
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #eca, #ace)",
        })
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #eca, #eca)",
        })
        .to(item20, {
          backgroundImage: "linear-gradient(45deg, #eca, #ace)",
        });
